interface:
  display_name: "Four-Slice Reality Poster"
  short_description: "Create four-state Natural-Region photo posters"
  default_prompt: "Use $four-slice-reality-poster to transform my photo into ONE continuous poster: the same photo divided into four natural regions, each region a different abstraction (Reality / 30% / 65% / 90%), with the boundary expressed by a torn-paper seam. Never output a 2x2 grid or four full-image versions."
